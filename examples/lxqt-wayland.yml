##
## LXQt 2.4 Wayland session — EXPERIMENTAL STUB.
##
## LXQt 2.4.0 split X11 and Wayland session settings; the Wayland path
## is still optional (lxqt-wayland-session) and depends on a separate
## compositor (labwc / kwin_wayland / wayfire). On FreeBSD the Wayland
## port surface for LXQt is not fully shaken out yet — treat this
## example as a placeholder until the upstream port matures.
##
## Requires on the HOST:
##   - WAYLAND_DISPLAY set (crate.mode=wayland refuses to start otherwise)
##   - XDG_RUNTIME_DIR pointing at the user runtime dir
##   - run `crate doctor` first; it will warn about missing pieces
##
## SECURITY: the session runs on the HOST compositor. Since 1.1.78 the
## jail gets a socket the compositor restricts (a security context,
## wp_security_context_v1 — sway 1.9 / wlroots 0.17, KWin 6, Mutter 46
## and later; `crate doctor` tells): the privileged protocols (virtual
## keyboard/pointer, screencopy, data-control, foreign-toplevel) are
## withheld from it. labwc below is an ordinary client of the host
## compositor and its own panel talks to labwc, so nothing here needs
## them. On a compositor without that protocol crate falls back to the
## compositor's own socket and warns (CRATE_WAYLAND_SHARED_ACK=1 to
## suppress): a client in the jail can then inject input into, capture
## and drive the whole host session. `wayland_security_context:
## require` below refuses to run instead. Either way the windows are in
## the operator's session — for a mutually-distrusting workload use
## gui.mode: headless, nested or compositor.
## See docs/trust-model.md, "Shared display plane".
##
## Inside the jail:
##   - lxqt-wayland-session must be available (check pkg search)
##   - a Wayland compositor must be installed and started before lxqt
##
## Use: crate create -s lxqt-wayland.yml
##

---

pkg:
    install:
        - lxqt
        - lxqt-wayland-session    # may not exist on FreeBSD yet — check pkg search
        - labwc                    # alt: kwin, wayfire, sway
        - qterminal
        - dbus

run:
    ## STUB: real launcher script that starts the compositor first,
    ## then exec's the LXQt Wayland session inside it.
    command: /usr/local/bin/start-lxqt-wayland.sh

scripts:
    run:before-execute:
        - |
          cat > /usr/local/bin/start-lxqt-wayland.sh <<'SH'
          #!/bin/sh
          export XDG_SESSION_TYPE=wayland
          export QT_QPA_PLATFORM=wayland
          # labwc execs its child after the compositor is up
          exec labwc -s "lxqt-session"
          SH
        - "chmod +x /usr/local/bin/start-lxqt-wayland.sh"

options:
    - net
    - x11      # kept as fallback for Xwayland clients
    - gl
    - video

gui:
    mode: wayland
    ## auto (default): restricted socket if the compositor can, else its
    ## own socket with a warning; require: restricted or no run; off:
    ## the compositor's own socket on purpose.
    # wayland_security_context: require
    resolution: 1920x1080
    ## VNC over Wayland needs a wayvnc-style bridge; left off until
    ## the FreeBSD port story stabilises.
    vnc: false
    novnc: false

limits:
    memoryuse: 1G
    pcpu: 100
    maxproc: 256

# 1.1.62: the jail sees only basic device nodes plus the classes named here
devices:
    sound: true
