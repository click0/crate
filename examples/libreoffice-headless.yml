##
## container for LibreOffice with headless VNC access
## Remote office suite via browser, password-protected VNC.
##
## Use: crate create -s libreoffice-headless.yml
## After running: crate gui list ; crate gui url libreoffice
##

---

pkg:
    install:
        - libreoffice

run:
    command: /usr/local/bin/libreoffice

dirs:
    share:
        - [$HOME/Documents, $HOME/Documents]

options:
    - x11
    - gl

gui:
    mode: headless
    resolution: 1920x1080
    vnc: true
    novnc: true
    vnc_password: "changeme"
    ## VNC and noVNC listen on 127.0.0.1 (noVNC too since 1.1.78): reach
    ## them over an SSH tunnel, or name an address of the host here —
    ## together with vnc_password, the stream is otherwise open to that
    ## network.
    # vnc_bind: 192.0.2.10
