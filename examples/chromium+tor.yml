##
## container for the Chromium browser (through the Tor network)
##

---

base:
    keep:
        - /sbin/sysctl

pkg:
    install:
        - chromium

run:
    command: /usr/local/bin/chrome --proxy-server="socks://localhost:9050"

options:
    - tor
    - x11
    - gl
    - video

# 1.1.62: the jail sees only basic device nodes plus the classes named here
devices:
    sound: true
