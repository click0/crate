##
## container for GIMP with headless VNC access
## Useful for remote image editing via browser.
##
## Use: crate create -s gimp-headless.yml
## After running: crate gui list ; crate gui url gimp
##

---

pkg:
    install:
        - gimp

run:
    command: /usr/local/bin/gimp

dirs:
    share:
        - [$HOME/Pictures, $HOME/Pictures]

options:
    - x11
    - gl

gui:
    mode: headless
    resolution: 1920x1080
    vnc: true
    novnc: true
    ## VNC and noVNC listen on 127.0.0.1 (noVNC too since 1.1.78): reach
    ## them over an SSH tunnel, or name an address of the host here —
    ## together with vnc_password, the stream is otherwise open to that
    ## network.
    # vnc_bind: 192.0.2.10
