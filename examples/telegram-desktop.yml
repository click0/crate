##
## container for Telegram Desktop messenger
##

---

pkg:
    install:
        - telegram-desktop

run:
    command: /usr/local/bin/Telegram

dirs:
    share:
        - [$HOME/.local/share/TelegramDesktop, $HOME/.local/share/TelegramDesktop]

options:
    - net
    - ssl-certs
    - x11
    - gl
    - video

# 1.1.62: the jail sees only basic device nodes plus the classes named here
devices:
    sound: true
