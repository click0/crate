##
## container for Thunderbird email client
##

---

pkg:
    install:
        - thunderbird

run:
    command: /usr/local/bin/thunderbird

dirs:
    share:
        - [$HOME/.thunderbird, $HOME/.thunderbird]

options:
    - net
    - x11
    - gl
    - ssl-certs

# 1.1.62: the jail sees only basic device nodes plus the classes named here
devices:
    sound: true
