name: Linux Unit Tests

# Swift feedback loop: build and run the kyua unit suite directly on an
# Ubuntu runner (no FreeBSD VM). Unit tests are pure C++ and do not depend
# on jail(2) / ZFS / pf — so they compile and run on Linux just fine via
# kyua + libatf from Ubuntu universe.
#
# This is a *complement* to the FreeBSD workflows, not a replacement:
#   * Linux unit tests: ~30 seconds, every push and every PR.
#   * Linux ASan+UBSan: ~2 minutes, same triggers (1.1.28).
#   * FreeBSD lite: ~4 minutes, every push (compile + link + unit suite).
#   * FreeBSD full: manual-only (workflow_dispatch) — see freebsd-build.yml.
#
# Functional tests (tests/functional/*) require a FreeBSD jail and are
# scoped out here via `kyua test unit`.

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'TODO'
      - 'CHANGELOG.md'
      - 'completions/**'
      - 'examples/**'
      - 'templates/**'
      - 'crate.5'
      - '.github/workflows/freebsd-build.yml'
      - '.github/workflows/freebsd-build-lite.yml'
  pull_request:
    # 1.1.28: was `[master]` — the repository's default branch is `main`,
    # so this trigger NEVER fired and the fastest gate in the repo ran on
    # push only, never as a PR check (fork PRs got nothing at all).
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Linux unit tests (kyua + libatf)
    steps:
      - uses: actions/checkout@v4

      - name: Install kyua + libatf + compiler
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ make libatf-dev kyua
          g++ --version | head -1
          kyua help >/dev/null
          echo "Toolchain ready."

      - name: Build + run unit suite
        run: |
          set -ex
          # `make test-unit` depends on $(UNIT_TEST_BINS), so it builds
          # every unit-test binary listed in the Makefile and then runs
          # `kyua test unit` (scoped to the unit Kyuafile, skipping the
          # FreeBSD-only functional tests). Adding a new test requires
          # only one edit (UNIT_TESTS in the Makefile).
          # -L/usr/local/lib is harmless on Linux; libatf-c++ resolves
          # via the default loader search path.
          #
          # 1.1.28: -Werror on Linux only (gcc and FreeBSD clang differ
          # enough that a global -Werror would be brittle); the Makefile
          # default is -Wall -Wextra without -Werror. KYUA_FLAGS runs the
          # 1400+ test cases in parallel instead of serially.
          # -Wno-missing-field-initializers: the tests aggregate-initialise
          # config structs with only the fields under test (e.g.
          # AuthToken{hash, role}); -Wextra's complaint about the rest is
          # noise, not a defect.
          make -j"$(nproc)" test-unit \
            TEST_CXXWARN="-Wall -Wextra -Wno-missing-field-initializers -Werror" \
            KYUA_FLAGS="-v parallelism=$(nproc)"

      - name: Kyua report on failure
        if: failure()
        run: |
          kyua report --verbose || true
          kyua report-html --output=kyua-html || true

      - name: Upload kyua HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kyua-html-linux
          path: kyua-html
          if-no-files-found: ignore
          retention-days: 7

  # 1.1.28: the pure modules are platform-independent, so AddressSanitizer
  # + UndefinedBehaviorSanitizer on Linux are cheap and catch exactly the
  # class the 1.1.22 ctx.cpp `erase(end())` UB belonged to. The Makefile
  # already threads COVERAGE_CXXFLAGS/COVERAGE_LDFLAGS into both test
  # rules, so no Makefile change is needed to instrument the build.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Linux unit tests under ASan + UBSan
    steps:
      - uses: actions/checkout@v4

      - name: Install libatf + compiler
        run: |
          set -ex
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ make libatf-dev kyua
          g++ --version | head -1

      - name: Build unit tests with -fsanitize=address,undefined
        run: |
          set -ex
          make -j"$(nproc)" build-unit-tests \
            COVERAGE_CXXFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1" \
            COVERAGE_LDFLAGS="-fsanitize=address,undefined"

      - name: Run every ATF test case directly
        run: |
          set -e
          # kyua scrubs the environment of the test process, so the
          # ASAN_OPTIONS / UBSAN_OPTIONS below would never reach it. Run
          # the ATF programs directly instead: `prog -l` lists the cases,
          # `prog <case>` runs one (exit 0 = passed/skipped, 1 = failed).
          # -fno-sanitize-recover=all above makes UBSan abort on the
          # first report regardless of the environment — belt and braces.
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cd tests/unit
          failed=0
          total=0
          for prog in *_test; do
            [ -x "$prog" ] || continue
            for tc in $(./"$prog" -l | sed -n 's/^ident: //p'); do
              total=$((total + 1))
              if ! out=$(./"$prog" "$tc" 2>&1); then
                echo "::error::$prog:$tc"
                echo "$out"
                failed=$((failed + 1))
              fi
            done
          done
          echo "ran $total test cases under ASan+UBSan, $failed failed"
          test "$failed" -eq 0
